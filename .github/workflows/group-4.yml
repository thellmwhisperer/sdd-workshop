# Group 4: when a pull request that touches group-4/app/ is merged into main, the app's
# tests run, and when they are green the app is published on the workshop's site, at
# https://<owner>.github.io/<repo>/group-4/ (.github/pages/publish.sh). A red test
# publishes nothing: the site keeps the last green app. Only this group's folder triggers it.
name: group 4
on:
  push:
    branches: [main]
    paths:
      - group-4/app/**
      - .github/workflows/group-4.yml
      - .github/pages/publish.sh
      - .github/pages/test.sh
  workflow_dispatch:
permissions:
  contents: write
# One queue per group: two merges of the same group publish one after the other. Two groups
# at once both publish: publish.sh tries again on top of the other's site.
concurrency:
  group: site-group-4
  cancel-in-progress: false
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The app's tests and lint
        run: sh .github/pages/test.sh group-4
      - name: Publish group-4 on the site
        run: sh .github/pages/publish.sh group-4
