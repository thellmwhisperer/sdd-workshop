<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Promotions</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header>
  <a class="brand" href="index.html">Brisa</a>
  <nav><a href="index.html">Home</a><a href="promotions.html" aria-current="page">Promotions</a><a href="till.html">Till</a></nav>
</header>
<main>
<h1>Promotions</h1>
<form id="form">
  <p><label>Name <input id="name"></label></p>
  <p><label>Kind
    <select id="kind">
      <option value="percent">percent</option>
      <option value="second-half">second half</option>
      <option value="three-for-two">three for two</option>
    </select></label></p>
  <p><label>Category <select id="category"></select></label></p>
  <p><label>Percent <input id="percent" type="number"></label></p>
  <p><label>Start <input id="start" type="date"></label></p>
  <p><label>End <input id="end" type="date"></label></p>
  <p><button type="submit" id="save">Save</button> <button type="button" id="cancel" hidden>Cancel</button></p>
</form>
<ul id="errors"></ul>
<table id="list">
  <thead><tr><th>Name</th><th>Kind</th><th>Category</th><th>Percent</th><th>Start</th><th>End</th><th></th></tr></thead>
  <tbody></tbody>
</table>
</main>
<script src="products.js"></script>
<script src="store.js"></script>
<script>
var editing = -1;

// The categories the shop sells, each once, in the order of Products.
function fillCategories() {
  var select = document.getElementById("category");
  var seen = [];
  Object.keys(Products).forEach(function (key) {
    var category = Products[key].category;
    if (seen.indexOf(category) >= 0) return;
    seen.push(category);
    var option = document.createElement("option");
    option.value = category;
    option.textContent = category;
    select.appendChild(option);
  });
}
fillCategories();

function fill(id, value) { document.getElementById(id).value = value === undefined ? "" : value; }

function startEdit(index) {
  var p = Store.list()[index];
  editing = index;
  fill("name", p.name); fill("kind", p.kind); fill("category", p.category);
  fill("percent", p.percent); fill("start", p.start); fill("end", p.end);
  document.getElementById("cancel").hidden = false;
}

function stopEdit() {
  editing = -1;
  document.getElementById("form").reset();
  document.getElementById("cancel").hidden = true;
}

function showErrors(result) {
  var errors = document.getElementById("errors");
  errors.textContent = "";
  result.errors.forEach(function (message) {
    var item = document.createElement("li");
    item.textContent = message;
    errors.appendChild(item);
  });
}

function render() {
  var body = document.querySelector("#list tbody");
  body.textContent = "";
  Store.list().forEach(function (p, index) {
    var row = document.createElement("tr");
    [p.name, p.kind, p.category, p.kind === "percent" ? p.percent + " %" : "", p.start, p.end]
      .forEach(function (value) {
        var cell = document.createElement("td");
        cell.textContent = value;
        row.appendChild(cell);
      });
    var actions = document.createElement("td");
    var edit = document.createElement("button");
    edit.type = "button";
    edit.textContent = "Edit";
    edit.addEventListener("click", function () { startEdit(index); });
    var del = document.createElement("button");
    del.type = "button";
    del.textContent = "Delete";
    del.addEventListener("click", function () {
      Store.remove(index);
      if (editing === index) stopEdit();
      else if (editing > index) editing -= 1;
      showErrors({ errors: [] });
      render();
    });
    actions.appendChild(edit);
    actions.appendChild(del);
    row.appendChild(actions);
    body.appendChild(row);
  });
}

document.getElementById("form").addEventListener("submit", function (event) {
  event.preventDefault();
  var value = function (id) { return document.getElementById(id).value; };
  var promotion = { name: value("name"), kind: value("kind"), category: value("category"),
    start: value("start"), end: value("end") };
  if (promotion.kind === "percent") promotion.percent = Number(value("percent"));
  var result = editing >= 0 ? Store.update(editing, promotion) : Store.add(promotion);
  showErrors(result);
  if (result.ok) stopEdit();
  render();
});

document.getElementById("cancel").addEventListener("click", stopEdit);

// A test page shows this page in a frame; from there it can only talk by message.
// The message { steps, read } sets fields, clicks buttons, and the reply says what the form shows.
window.addEventListener("message", function (event) {
  if (window.parent === window || !event.data || !event.data.steps) return;
  event.data.steps.forEach(function (step) {
    if (step.set) document.getElementById(step.set[0]).value = step.set[1];
    if (step.click) document.querySelector(step.click).click();
  });
  var reply = { token: event.data.token, promotions: Store.list(), values: {}, options: {}, tags: {} };
  (event.data.read || []).forEach(function (id) {
    var field = document.getElementById(id);
    reply.values[id] = field.value;
    reply.tags[id] = field.tagName;
    reply.options[id] = field.options ? Array.prototype.map.call(field.options, function (o) { return o.value; }) : [];
  });
  event.source.postMessage(reply, "*");
});

render();
</script>
</body>
</html>
